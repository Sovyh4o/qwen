<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rhythm Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 40, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button, select, input[type="range"] {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: rgba(50, 50, 80, 0.7);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover, select:hover {
            background: rgba(100, 150, 255, 0.5);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
        }

        button.active {
            background: linear-gradient(135deg, #00f2ff, #00c3ff);
            color: #000;
            font-weight: bold;
        }

        input[type="range"] {
            width: 120px;
            accent-color: #00f2ff;
        }

        .stats {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(20, 20, 40, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }

        .title {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00f2ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        @media (max-width: 768px) {
            .controls {
                bottom: 10px;
                padding: 15px;
                gap: 10px;
            }
            
            .control-group {
                min-width: 100%;
            }
            
            input[type="range"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="title">🎵 Neon Rhythm</div>
    
    <div class="stats">
        <div>Частиц: <span id="particleCount">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Режим</label>
            <select id="modeSelect">
                <option value="wave">Волна</option>
                <option value="spiral">Спираль</option>
                <option value="burst">Взрыв</option>
                <option value="orbit">Орбита</option>
                <option value="random">Хаос</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Цвет</label>
            <select id="colorSelect">
                <option value="neon">Неон</option>
                <option value="sunset">Закат</option>
                <option value="ocean">Океан</option>
                <option value="fire">Огонь</option>
                <option value="matrix">Матрица</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Скорость</label>
            <input type="range" id="speedSlider" min="1" max="10" value="5">
        </div>
        
        <div class="control-group">
            <label>Количество</label>
            <input type="range" id="countSlider" min="50" max="500" value="200">
        </div>
        
        <div class="control-group">
            <label>&nbsp;</label>
            <button id="pauseBtn">⏸️ Пауза</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let animationId;
        let isPaused = false;
        let lastTime = 0;
        let frameCount = 0;
        let fps = 0;
        
        // Настройки
        const settings = {
            mode: 'wave',
            colorScheme: 'neon',
            speed: 5,
            particleCount: 200
        };
        
        // Цветовые схемы
        const colorSchemes = {
            neon: ['#00f2ff', '#00c3ff', '#ff00ff', '#bf00ff', '#00ff88'],
            sunset: ['#ff6b6b', '#ffa502', '#ffdd59', '#ff7979', '#fd79a8'],
            ocean: ['#00d2d3', '#0abde3', '#54a0ff', '#5f27cd', '#10ac84'],
            fire: ['#ff4757', '#ffa502', '#ff6348', '#e84118', '#c23616'],
            matrix: ['#00ff41', '#008f11', '#003b00', '#00ff88', '#00cc6a']
        };
        
        // Класс частицы
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * settings.speed;
                this.speedY = (Math.random() - 0.5) * settings.speed;
                this.color = this.getRandomColor();
                this.life = Math.random() * 100 + 50;
                this.maxLife = this.life;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 100 + 50;
            }
            
            getRandomColor() {
                const colors = colorSchemes[settings.colorScheme];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            update(mouseX, mouseY) {
                this.life--;
                
                if (this.life <= 0) {
                    this.reset();
                    return;
                }
                
                switch(settings.mode) {
                    case 'wave':
                        this.x += Math.sin(this.angle + Date.now() / 1000) * settings.speed;
                        this.y += Math.cos(this.angle + Date.now() / 1500) * settings.speed;
                        break;
                        
                    case 'spiral':
                        this.angle += 0.02 * settings.speed / 5;
                        this.radius += 0.5;
                        if (this.radius > Math.min(width, height) / 2) {
                            this.radius = 50;
                        }
                        this.x = width / 2 + Math.cos(this.angle) * this.radius;
                        this.y = height / 2 + Math.sin(this.angle) * this.radius;
                        break;
                        
                    case 'burst':
                        const dx = mouseX - this.x;
                        const dy = mouseY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 200) {
                            this.speedX = dx / dist * settings.speed * 2;
                            this.speedY = dy / dist * settings.speed * 2;
                        }
                        this.x += this.speedX;
                        this.y += this.speedY;
                        this.speedX *= 0.98;
                        this.speedY *= 0.98;
                        break;
                        
                    case 'orbit':
                        const centerX = width / 2;
                        const centerY = height / 2;
                        const angleToCenter = Math.atan2(this.y - centerY, this.x - centerX);
                        const distToCenter = Math.sqrt(Math.pow(this.x - centerX, 2) + Math.pow(this.y - centerY, 2));
                        
                        this.angle += 0.03 * settings.speed / 5;
                        this.x = centerX + Math.cos(this.angle) * distToCenter;
                        this.y = centerY + Math.sin(this.angle) * distToCenter;
                        break;
                        
                    case 'random':
                        this.x += (Math.random() - 0.5) * settings.speed * 2;
                        this.y += (Math.random() - 0.5) * settings.speed * 2;
                        break;
                }
                
                // Границы экрана
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
                
                // Ограничение координат
                this.x = Math.max(0, Math.min(width, this.x));
                this.y = Math.max(0, Math.min(height, this.y));
            }
            
            draw() {
                const opacity = this.life / this.maxLife;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = opacity;
                ctx.fill();
                
                // Свечение
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }
        
        // Инициализация
        function init() {
            resize();
            createParticles();
            animate();
            
            window.addEventListener('resize', resize);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('click', handleClick);
            
            // Обработчики контролов
            document.getElementById('modeSelect').addEventListener('change', (e) => {
                settings.mode = e.target.value;
            });
            
            document.getElementById('colorSelect').addEventListener('change', (e) => {
                settings.colorScheme = e.target.value;
                particles.forEach(p => p.color = p.getRandomColor());
            });
            
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                settings.speed = parseInt(e.target.value);
            });
            
            document.getElementById('countSlider').addEventListener('input', (e) => {
                const newCount = parseInt(e.target.value);
                if (newCount > particles.length) {
                    for (let i = particles.length; i < newCount; i++) {
                        particles.push(new Particle());
                    }
                } else {
                    particles = particles.slice(0, newCount);
                }
                settings.particleCount = newCount;
            });
            
            document.getElementById('pauseBtn').addEventListener('click', () => {
                isPaused = !isPaused;
                document.getElementById('pauseBtn').textContent = isPaused ? '▶️ Старт' : '⏸️ Пауза';
                if (!isPaused) animate();
            });
        }
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        function createParticles() {
            particles = [];
            for (let i = 0; i < settings.particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        let mouseX = width / 2;
        let mouseY = height / 2;
        
        function handleMouseMove(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }
        
        function handleClick(e) {
            // Эффект всплеска
            for (let i = 0; i < 20; i++) {
                const particle = new Particle();
                particle.x = e.clientX;
                particle.y = e.clientY;
                particle.speedX = (Math.random() - 0.5) * 15;
                particle.speedY = (Math.random() - 0.5) * 15;
                particle.life = 50;
                particles.push(particle);
            }
            
            // Удаляем лишние частицы
            if (particles.length > settings.particleCount + 100) {
                particles = particles.slice(-settings.particleCount);
            }
        }
        
        function animate(currentTime = 0) {
            if (isPaused) return;
            
            // Расчет FPS
            const deltaTime = currentTime - lastTime;
            if (deltaTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = currentTime;
                document.getElementById('fps').textContent = fps;
                document.getElementById('particleCount').textContent = particles.length;
            }
            frameCount++;
            
            // Очистка с эффектом шлейфа
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Обновление и отрисовка частиц
            particles.forEach(particle => {
                particle.update(mouseX, mouseY);
                particle.draw();
            });
            
            // Соединение близких частиц линиями
            ctx.strokeStyle = colorSchemes[settings.colorScheme][0];
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        const opacity = (100 - distance) / 100 * 0.5;
                        ctx.globalAlpha = opacity;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Запуск
        init();
    </script>
</body>
</html>
