<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Калькулятор</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .calculator {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 1rem;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            background: #e0e0e0;
            color: #333;
        }
        button:hover {
            background: #d0d0d0;
        }
        button.operator {
            background: #ff9f43;
            color: white;
        }
        button.operator:hover {
            background: #f39c12;
        }
        button.equal {
            background: #2ecc71;
            color: white;
            grid-column: span 2;
        }
        button.equal:hover {
            background: #27ae60;
        }
        button.clear {
            background: #e74c3c;
            color: white;
            grid-column: span 2;
        }
        button.clear:hover {
            background: #c0392b;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Калькулятор</h2>
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>
        
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>
        
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">−</button>
        
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>
        
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
    <div class="footer">Тестовый проект для GitHub Pages</div>
</div>

<script>
    const display = document.getElementById('display');
    
    function appendNumber(num) {
        display.value += num;
    }
    
    function appendOperator(op) {
        const lastChar = display.value.slice(-1);
        if (['+', '-', '*', '/'].includes(lastChar)) {
            display.value = display.value.slice(0, -1) + op;
        } else if (display.value !== '') {
            display.value += op;
        }
    }
    
    function clearDisplay() {
        display.value = '';
    }
    
    function deleteLast() {
        display.value = display.value.toString().slice(0, -1);
    }
    
    function calculate() {
        try {
            // Заменяем визуальные операторы на программные перед вычислением если нужно
            // В данном случае мы уже храним *, /, +, -
            if (display.value === '') return;
            const result = eval(display.value);
            
            if (!isFinite(result)) {
                display.value = 'Ошибка';
                setTimeout(clearDisplay, 1500);
            } else {
                display.value = result;
            }
        } catch (error) {
            display.value = 'Ошибка';
            setTimeout(clearDisplay, 1500);
        }
    }
    
    // Поддержка клавиатуры
    document.addEventListener('keydown', (event) => {
        const key = event.key;
        if (/[0-9]/.test(key)) appendNumber(key);
        if (['+', '-', '*', '/'].includes(key)) appendOperator(key);
        if (key === 'Enter') calculate();
        if (key === 'Backspace') deleteLast();
        if (key === 'Escape') clearDisplay();
        if (key === '.') appendNumber('.');
    });
</script>

</body>
</html>
